<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TRAP Announcement</title>

<style>
    body {
        margin: 0;
        background: transparent;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #annonce {
        position: absolute;
        top: 2.8%;
        left: 50%;
        transform: translateX(-50%);
        min-width: 380px;
        max-width: 520px;
        background: rgba(10, 15, 30, 0.92);
        border-radius: 12px;
        border: 1px solid rgba(80, 140, 255, 0.30);
        box-shadow: 0 0 14px rgba(80, 140, 255, 0.20);
        display: none;
        overflow: hidden;
        animation: slideDown 0.30s ease-out;
    }

    #header {
        padding: 10px;
        text-align: center;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.8px;
        color: #e6efff;
        background: linear-gradient(90deg, #1e3c72, #2a5298);
        text-transform: uppercase;
    }

    #message {
        padding: 14px 16px;
        color: #dbe7ff;
        font-size: 14px;
        text-align: center;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.25);
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translate(-50%, -18px);
        }
        to {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    }
</style>
</head>

<body>

<div id="annonce">
    <div id="header">Entreprise</div>
    <div id="message">Message</div>
</div>

<script>
    window.addEventListener('message', function(event) {
        if (event.data.action === 'show') {

            document.getElementById('header').innerText =
                event.data.job;

            document.getElementById('message').innerText =
                event.data.message;

            const box = document.getElementById('annonce');
            box.style.display = 'block';

            clearTimeout(window.trapAnnTimer);
            window.trapAnnTimer = setTimeout(() => {
                box.style.display = 'none';
            }, 8000);
        }
    });
</script>

</body>
</html>
